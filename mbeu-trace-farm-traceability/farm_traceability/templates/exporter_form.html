{% extends "base.html" %}
{% block page_title %}Register exporter{% endblock %}
{% block content %}

<div class="panel" style="max-width:600px;">
  <h2>Exporter details</h2>
  <form method="post">
    <div class="form-grid narrow">
      <div class="field"><label>Company name *</label><input type="text" name="company_name" required></div>
      <div class="field"><label>Contact person</label><input type="text" name="contact_person"></div>
      <div class="field"><label>Phone</label><input type="text" name="phone"></div>
      <div class="field"><label>Email</label><input type="email" name="email"></div>
      <div class="field"><label>Export license number</label><input type="text" name="license_number"></div>
      <div class="field"><label>Country</label><input type="text" name="country" value="Zimbabwe"></div>
    </div>
    <div style="margin-top:20px;">
      <button class="btn" type="submit">Register exporter</button>
      <a href="{{ url_for('exporters_list') }}" class="btn btn-outline">Cancel</a>
    </div>
  </form>
</div>

{% endblock %}
